name: Sync Garmin sleep to Notion
on:
  schedule:
    # Daily sync stays at 3 days. A larger window is a manual run only.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      SYNC_DAYS:
        description: "Past days to sync. Scheduled runs ignore this and stay at 3. Use 60 for a one-time backfill."
        required: false
        default: "3"
        type: string
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          echo "SYNC_DAYS=${SYNC_DAYS}"
          python sync_sleep.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SLEEP_DB: ${{ secrets.NOTION_SLEEP_DB }}
          # Cron events have no inputs, so this falls back to 3. A manual run uses the input.
          SYNC_DAYS: ${{ inputs.SYNC_DAYS || '3' }}
